name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare www directory for Capacitor
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js www/

      - name: Add Android platform
        run: npx cap add android

      - name: Bump Android SDK versions
        run: |
          # Bump SDK versions in variables.gradle
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 24/' android/variables.gradle
          sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 35/' android/variables.gradle
          sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 35/' android/variables.gradle
          sed -i 's/compileSdk [0-9]*/compileSdk 35/' android/variables.gradle
          sed -i 's/targetSdk [0-9]*/targetSdk 35/' android/variables.gradle

          # Update gradle wrapper properties
          echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-all.zip" > android/gradle/wrapper/gradle-wrapper.properties

      - name: Sync web code to Android
        run: npx cap sync android

      - name: Build APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: map-to-area-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
