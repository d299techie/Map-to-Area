<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<title>Map to Area</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script>
// Detect native Capacitor bridge — skip vendor web-fallback scripts on native
(function(){
  var isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) ||
    !!(window.androidBridge) ||
    !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.bridge);
  if (!isNative) {
    document.write('<script src="vendor/capacitor.js"><\/script>');
    document.write('<script src="vendor/filesystem.js"><\/script>');
    document.write('<script src="vendor/share.js"><\/script>');
    document.write('<script src="vendor/html2canvas.min.js"><\/script>');
  } else {
    document.write('<script src="vendor/html2canvas.min.js"><\/script>');
  }
})();
</script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
body { display: flex; flex-direction: column; }
header {
  background: #1a1a2e; color: #eee; padding: 8px 12px;
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 6px; position: relative; z-index: 1000;
}
header h1 { font-size: 16px; font-weight: 600; }
header h1 small { font-size: 11px; color: #888; font-weight: 400; display: block; }
.controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.controls button, .controls select {
  padding: 5px 10px; border: none; border-radius: 4px;
  cursor: pointer; font-size: 12px; transition: background .15s;
}
.btn-primary { background: #0f3460; color: #fff; }
.btn-primary:hover { background: #1a5276; }
.btn-danger { background: #e94560; color: #fff; }
.btn-danger:hover { background: #c73a52; }
.btn-success { background: #2d6a4f; color: #fff; }
.btn-success:hover { background: #40916c; }
.btn-gps { background: #e9c46a; color: #1a1a2e; }
.btn-gps.active { background: #f4a261; }
.btn-secondary { background: #16213e; color: #ccc; }
.btn-secondary:hover { background: #1f2f52; }
.btn-mode { background: #3a2a6f; color: #ddd; }
.btn-mode.active { background: #7c3aed; color: #fff; }
.btn-mode:hover { background: #5b21b6; color: #fff; }
.btn-warning { background: #d4a017; color: #1a1a2e; }
.btn-warning:hover { background: #e8b830; }
#map { flex: 1; min-height: 0; }
.area-panel {
  background: rgba(26, 26, 46, 0.95); color: #eee; padding: 10px 16px;
  display: flex; gap: 20px; flex-wrap: wrap; align-items: center;
  position: relative; z-index: 1000; border-top: 1px solid #333;
}
.area-stat { display: flex; flex-direction: column; min-width: 80px; }
.area-stat .value { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.area-stat .label { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: .5px; }
.area-stat .sub { font-size: 10px; color: #666; }
.points-box { display: flex; align-items: center; gap: 6px; border: 1px solid #444; border-radius: 6px; padding: 2px 8px; }
.points-box .area-stat { min-width: auto; }
.points-box .area-stat .value { font-size: 14px; }
.pts-toggle { position: relative; display: inline-block; width: 32px; height: 18px; cursor: pointer; }
.pts-toggle input { opacity: 0; width: 0; height: 0; }
.pts-toggle .slider { position: absolute; inset: 0; background: #555; border-radius: 18px; transition: .2s; }
.pts-toggle .slider::before { content: ''; position: absolute; left: 2px; bottom: 2px; width: 14px; height: 14px; background: #ccc; border-radius: 50%; transition: .2s; }
.pts-toggle input:checked + .slider { background: #7c3aed; }
.pts-toggle input:checked + .slider::before { transform: translateX(14px); background: #fff; }
.search-input { padding: 4px 8px; border: 1px solid #444; border-radius: 4px; font-size: 12px; background: #16213e; color: #eee; width: 150px; outline: none; flex-shrink: 0; }
.search-input::placeholder { color: #666; }
.search-input:focus { border-color: #7c3aed; }
.search-wrap { position: relative; display: flex; align-items: center; gap: 4px; }
.search-results { position: absolute; top: 100%; left: 0; right: 44px; z-index: 9999; background: #1a1a2e; border: 1px solid #444; border-radius: 4px; max-height: 160px; overflow-y: auto; display: none; }
.search-results div { padding: 5px 8px; font-size: 11px; color: #ccc; cursor: pointer; border-bottom: 1px solid #333; }
.search-results div:hover, .search-results div.selected { background: #2d2d5e; color: #fff; }
.search-results div:last-child { border-bottom: none; }
.bottom-actions { display: flex; gap: 6px; align-items: center; margin-left: auto; }
.bottom-actions button { padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; transition: background .15s; }
.btn-live { background: #2d6a4f; color: #fff; }
.btn-live:hover { background: #40916c; }
.btn-live.recording { background: #e94560; color: #fff; animation: live-pulse 1s infinite; }
@keyframes live-pulse {
  0% { box-shadow: 0 0 0 0 rgba(233, 69, 96, 0.6); }
  70% { box-shadow: 0 0 0 8px rgba(233, 69, 96, 0); }
  100% { box-shadow: 0 0 0 0 rgba(233, 69, 96, 0); }
}
.hint {
  color: #888; font-size: 12px; padding: 0 16px 6px;
  background: rgba(26, 26, 46, 0.95); position: relative; z-index: 1000;
}
.leaflet-container { background: #0d1b2a; }
.leaflet-control-zoom a { background: #1a1a2e; color: #ccc; border-color: #333; }
.leaflet-control-zoom a:hover { background: #16213e; color: #fff; }
.leaflet-control-attribution { background: rgba(26,26,46,.85) !important; color: #555; font-size: 9px !important; }
.leaflet-control-attribution a { color: #777; }
.point-label { background: none !important; border: none !important; box-shadow: none !important;
  color: #ff6b81; font-weight: bold; font-size: 11px; }
.gps-marker-pulse {
  width: 12px; height: 12px; background: #4cc9f0; border: 2px solid #fff;
  border-radius: 50%; animation: pulse 1.5s infinite;
}
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(76, 201, 240, 0.7); }
  70% { box-shadow: 0 0 0 10px rgba(76, 201, 240, 0); }
  100% { box-shadow: 0 0 0 0 rgba(76, 201, 240, 0); }
}
.gps-coords {
  font-size: 10px; color: #4cc9f0; padding: 0 16px 6px;
  background: rgba(26, 26, 46, 0.95); position: relative; z-index: 1000;
  display: flex; gap: 16px;
}
.gps-coords span { display: flex; align-items: center; gap: 4px; }
.gps-coords .dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  margin-right: 4px;
}
.gps-coords .dot.fix { background: #4cc9f0; }
.gps-coords .dot.no-fix { background: #e94560; }
.search-box {
  display: flex; gap: 4px; align-items: center;
}
.search-box input {
  padding: 4px 8px; border: none; border-radius: 4px; font-size: 12px;
  background: #16213e; color: #eee; width: 120px; outline: none;
}
.search-box input::placeholder { color: #666; }
@media (max-width: 520px) {
  header h1 small { display: none; }
  .controls button, .controls select { font-size: 11px; padding: 4px 7px; }
  .area-stat .value { font-size: 14px; }
  .search-box input { width: 80px; }
}
@media (max-width: 400px) {
  .search-box input { width: 60px; font-size: 10px; }
}
</style>
</head>
<body>
<header>
  <h1>Map to Area <small>GPS field area measurement</small></h1>
  <div class="controls">
    <button id="modeBtn" class="btn-mode active">Area</button>
    <select id="unitSelect">
      <option value="sqft" selected>ft&sup2;</option>
      <option value="cent">Cents</option>
      <option value="acre">Acres</option>
      <option value="sqm">m&sup2;</option>
      <option value="are">Are</option>
      <option value="ha">Hectares</option>
      <option value="sqkm">km&sup2;</option>
      <option value="sqyd">yd&sup2;</option>
      <option value="sqmi">mi&sup2;</option>
    </select>
    <select id="lenUnitSelect">
      <option value="ft" selected>ft</option>
      <option value="m">m</option>
      <option value="km">km</option>
      <option value="yd">yd</option>
      <option value="mi">mi</option>
    </select>
  </div>
  <div class="controls">
    <button id="drawBtn" class="btn-primary">Start Drawing</button>
    <button id="undoBtn" class="btn-secondary" disabled title="Undo last point">&#x2190; Undo</button>
    <button id="redoBtn" class="btn-secondary" disabled title="Redo last undone point">Redo &#x2192;</button>
    <button id="clearBtn" class="btn-danger" disabled>Clear</button>
    <button id="saveMapBtn" class="btn-secondary" title="Save map markings" disabled>&#x1F4BE; Save</button>
    <button id="loadMapBtn" class="btn-secondary" title="Open saved map">&#x1F4C2; Open</button>
    <button id="screenshotBtn" class="btn-secondary" title="Take screenshot">&#x1F4F7;</button>
  </div>
</header>
<div id="map"></div>
<div class="gps-coords" id="gpsCoords">
  <span><span class="dot no-fix" id="gpsDot"></span>GPS: <span id="gpsStatus">off</span></span>
  <span id="gpsLatDisplay">Lat: &mdash;</span>
  <span id="gpsLngDisplay">Lng: &mdash;</span>
  <span id="gpsAccDisplay">Acc: &mdash;</span>
</div>
<div class="hint" id="hint">Click on the map to place points and form a polygon</div>
<div class="area-panel">
  <div class="area-stat">
    <span class="label" id="primaryLabel">Area</span>
    <span class="value" id="primaryValue">&mdash;</span>
    <span class="sub" id="primarySub"></span>
  </div>
  <div class="area-stat">
    <span class="label">Perimeter</span>
    <span class="value" id="perimValue">&mdash;</span>
    <span class="sub" id="perimSub">km</span>
  </div>
  <div class="area-stat">
    <span class="label">Length</span>
    <span class="value" id="lengthValue">&mdash;</span>
    <span class="sub" id="lengthSub">m</span>
  </div>
  <div class="points-box">
    <div class="area-stat">
      <span class="label">Points</span>
      <span class="value" id="pointCount">0</span>
    </div>
    <label class="pts-toggle">
      <input type="checkbox" id="ptsCheckbox" checked>
      <span class="slider"></span>
    </label>
  </div>
  <div class="search-wrap">
    <input id="searchInput" type="text" inputmode="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Search place or lat,lng..." class="search-input" />
    <div id="searchResults" class="search-results"></div>
    <button id="searchGoBtn" class="btn-primary" title="Go to selected place or coordinate">Go</button>
  </div>
  <button id="saveGpsBtn" class="btn-secondary" disabled title="Save current GPS location">&#x1F4CC;</button>
  <button id="pinsBtn" class="btn-secondary" title="Saved locations">&#x1F4CD;</button>
  <div class="bottom-actions">
    <button id="gpsLocateBtn" class="btn-gps" title="Locate my position and move map">&#x1F4CD; Locate</button>
    <button id="gpsDropBtn" class="btn-success" disabled title="Place a marker at current GPS position">+GPS</button>
    <button id="liveBtn" class="btn-secondary" disabled title="Auto-draw points as GPS moves">Live</button>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@7/turf.min.js"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
(() => {
  const map = L.map('map', {
    center: [20, 0], zoom: 2,
    worldCopyJump: true, zoomControl: true, maxZoom: 22,
  });

  const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: '&copy; Esri, Maxar, Earthstar Geographics',
    maxZoom: 22,
    maxNativeZoom: 19,
    crossOrigin: 'anonymous',
    updateWhenIdle: true,
  }).addTo(map);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OSM, CARTO',
    maxZoom: 22,
    maxNativeZoom: 19,
    crossOrigin: 'anonymous',
    subdomains: 'abcd',
  }).addTo(map);

  const AREA_UNITS = {
    acre: { v: 0.000247105, l: 'acres' },
    cent: { v: 0.0247105, l: 'cents' },
    sqft: { v: 10.7639, l: 'ft\u00b2' },
    ha: { v: 1e-4, l: 'ha' },
    are: { v: 0.01, l: 'are' },
    sqkm: { v: 1e-6, l: 'km\u00b2' },
    sqm: { v: 1, l: 'm\u00b2' },
    sqmi: { v: 3.861e-7, l: 'mi\u00b2' },
    sqyd: { v: 1.19599, l: 'yd\u00b2' },
  };

  const LENGTH_UNITS = {
    m: { v: 1, l: 'm' },
    km: { v: 1e-3, l: 'km' },
    ft: { v: 3.28084, l: 'ft' },
    yd: { v: 1.09361, l: 'yd' },
    mi: { v: 0.000621371, l: 'mi' },
  };

  const state = { points: [], redoStack: [], drawing: false, gpsActive: false, live: false, showPoints: true, mode: 'area' };
  let drawnLayer, measureLayer, ghostLine, ghostMarker, dragMarkers = [];
  let gpsMarker, gpsAccuracyCircle, gpsWatchId = null;
  let dragIndex = null;

  // ---- Persistent JSON storage (app Documents folder on Android, localStorage fallback on web) ----
  const Store = (() => {
    const isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
    // On native Android, plugins come from the native bridge. On web, they come from vendor/ scripts.
    const FS = isNative ? (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem) : (window.capacitorFilesystem && window.capacitorFilesystem.Filesystem);
    const Dir = isNative ? null : (window.capacitorFilesystem && window.capacitorFilesystem.Directory);
    // For Directory enum, use the string literals directly
    const DirDocuments = 'DOCUMENTS';
    const FILE = 'maparea_data.json';
    const cache = { pins: [], maps: {} };

    function loadLocal() {
      let pins = [], maps = {};
      try { pins = JSON.parse(localStorage.getItem('maparea_saved_gps') || '[]'); } catch {}
      try { maps = JSON.parse(localStorage.getItem('maparea_saved_maps') || '{}'); } catch {}
      return { pins, maps };
    }

    async function persist() {
      try {
        localStorage.setItem('maparea_saved_gps', JSON.stringify(cache.pins));
        localStorage.setItem('maparea_saved_maps', JSON.stringify(cache.maps));
      } catch {}
      if (!isNative || !FS) return;
      try {
        await FS.writeFile({
          path: FILE, directory: DirDocuments,
          data: JSON.stringify(cache, null, 2), encoding: 'utf8', recursive: true,
        });
      } catch (e) { console.warn('Storage write failed', e); }
    }

    async function init() {
      cache.pins = [];
      cache.maps = {};
      if (isNative && FS) {
        try {
          const r = await FS.readFile({ path: FILE, directory: DirDocuments, encoding: 'utf8' });
          const data = typeof r.data === 'string' ? JSON.parse(r.data) : r.data;
          cache.pins = data.pins || [];
          cache.maps = data.maps || {};
        } catch {}
      }
      // Merge any localStorage entries that are not yet in the file
      const local = loadLocal();
      local.pins.forEach(p => {
        if (!cache.pins.some(x => x.name === p.name && x.lat === p.lat && x.lng === p.lng)) cache.pins.push(p);
      });
      Object.keys(local.maps).forEach(name => {
        if (!cache.maps[name]) cache.maps[name] = local.maps[name];
      });
      await persist();
    }

    return {
      init, persist,
      get pins() { return cache.pins; },
      get maps() { return cache.maps; },
      isNative,
      addPin(pin) { cache.pins.push(pin); return persist(); },
      removePin(index) { cache.pins.splice(index, 1); return persist(); },
      setMap(name, data) { cache.maps[name] = data; return persist(); },
      deleteMap(name) { delete cache.maps[name]; return persist(); },
    };
  })();

  const primaryEl = document.getElementById('primaryValue');
  const primarySubEl = document.getElementById('primarySub');
  const primaryLabel = document.getElementById('primaryLabel');
  const perimEl = document.getElementById('perimValue');
  const perimSubEl = document.getElementById('perimSub');
  const lengthEl = document.getElementById('lengthValue');
  const lengthSubEl = document.getElementById('lengthSub');
  const pointCountEl = document.getElementById('pointCount');
  const hintEl = document.getElementById('hint');
  const drawBtn = document.getElementById('drawBtn');
  const gpsDropBtn = document.getElementById('gpsDropBtn');
  const gpsLocateBtn = document.getElementById('gpsLocateBtn');
  const saveGpsBtn = document.getElementById('saveGpsBtn');
  const undoBtn = document.getElementById('undoBtn');
  const redoBtn = document.getElementById('redoBtn');
  const clearBtn = document.getElementById('clearBtn');
  const ptsCheckbox = document.getElementById('ptsCheckbox');
  const modeBtn = document.getElementById('modeBtn');
  const unitSelect = document.getElementById('unitSelect');
  const lenUnitSelect = document.getElementById('lenUnitSelect');
  const saveMapBtn = document.getElementById('saveMapBtn');
  const loadMapBtn = document.getElementById('loadMapBtn');
  const screenshotBtn = document.getElementById('screenshotBtn');
  const searchInput = document.getElementById('searchInput');
  const searchResults = document.getElementById('searchResults');
  const searchGoBtn = document.getElementById('searchGoBtn');
  const gpsStatus = document.getElementById('gpsStatus');
  const gpsLatDisplay = document.getElementById('gpsLatDisplay');
  const gpsLngDisplay = document.getElementById('gpsLngDisplay');
  const gpsAccDisplay = document.getElementById('gpsAccDisplay');
  const gpsDot = document.getElementById('gpsDot');
  const liveBtn = document.getElementById('liveBtn');
  const pinsBtn = document.getElementById('pinsBtn');

  let gpsPosition = null;

  function geoToMeters(p1, p2) {
    const R = 6371000;
    const dLat = (p2[1] - p1[1]) * Math.PI / 180;
    const dLon = (p2[0] - p1[0]) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + Math.cos(p1[1]*Math.PI/180) * Math.cos(p2[1]*Math.PI/180) * Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function areaOfPolygon(pts) {
    if (pts.length < 3) return 0;
    const closed = pts.map(p => [p.lng, p.lat]);
    try {
      const poly = turf.polygon([[...closed, closed[0]]]);
      return turf.area(poly);
    } catch { return 0; }
  }

  function perimeterOfPolygon(pts) {
    if (pts.length < 2) return 0;
    let perim = 0;
    for (let i = 0; i < pts.length; i++) {
      const j = (i + 1) % pts.length;
      perim += geoToMeters([pts[i].lng, pts[i].lat], [pts[j].lng, pts[j].lat]);
    }
    return perim;
  }

  function lengthOfPoints(pts) {
    if (pts.length < 2) return 0;
    let len = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      len += geoToMeters([pts[i].lng, pts[i].lat], [pts[i + 1].lng, pts[i + 1].lat]);
    }
    return len;
  }

  function clearLayers() {
    if (drawnLayer) { map.removeLayer(drawnLayer); drawnLayer = null; }
    if (measureLayer) { map.removeLayer(measureLayer); measureLayer = null; }
    if (ghostLine) { map.removeLayer(ghostLine); ghostLine = null; }
    if (ghostMarker) { map.removeLayer(ghostMarker); ghostMarker = null; }
    dragMarkers.forEach(m => { if (m) map.removeLayer(m); });
    dragMarkers = [];
  }

  function formatArea(sqMeters, unit) {
    const u = AREA_UNITS[unit];
    if (!u) return { value: '\u2014', label: '' };
    const val = sqMeters * u.v;
    return { value: val >= 100 ? val.toLocaleString('en', {maximumFractionDigits: 2}) : val.toLocaleString('en', {maximumFractionDigits: 4}), label: u.l };
  }

  function formatLen(meters, unit) {
    const u = LENGTH_UNITS[unit];
    if (!u) return { value: '\u2014', label: '' };
    const val = meters * u.v;
    return { value: val >= 100 ? val.toLocaleString('en', {maximumFractionDigits: 2}) : val.toLocaleString('en', {maximumFractionDigits: 4}), label: u.l };
  }

  function getAreaUnit() {
    const v = unitSelect.value;
    return AREA_UNITS[v] ? v : 'sqkm';
  }

  function getLengthUnit() {
    return lenUnitSelect.value || 'km';
  }

  function updateUI() {
    const pts = state.points;
    const mode = state.mode;
    pointCountEl.textContent = pts.length;

    unitSelect.disabled = mode === 'length';
    saveMapBtn.disabled = pts.length === 0;

    if (pts.length < 2) {
      primaryEl.textContent = '\u2014';
      primarySubEl.textContent = '';
      perimEl.textContent = '\u2014';
      perimSubEl.textContent = '\u2014';
      lengthEl.textContent = '\u2014';
      lengthSubEl.textContent = '\u2014';
      clearBtn.disabled = pts.length === 0;
      return;
    }

    const lenMeters = lengthOfPoints(pts);
    const lenUnit = getLengthUnit();
    const lenFmt = formatLen(lenMeters, lenUnit);

    lengthEl.textContent = lenFmt.value;
    lengthSubEl.textContent = lenFmt.label;
    clearBtn.disabled = false;

    if (mode === 'area') {
      primaryLabel.textContent = 'Area';
      if (pts.length >= 3) {
        const sqMeters = areaOfPolygon(pts);
        const perimMeters = perimeterOfPolygon(pts);
        const areaUnit = getAreaUnit();
        const fmt = formatArea(sqMeters, areaUnit);
        const perimFmt = formatLen(perimMeters, lenUnit);
        primaryEl.textContent = fmt.value;
        primarySubEl.textContent = fmt.label;
        perimEl.textContent = perimFmt.value;
        perimSubEl.textContent = perimFmt.label;
      } else {
        primaryEl.textContent = '\u2014';
        primarySubEl.textContent = '';
        perimEl.textContent = '\u2014';
        perimSubEl.textContent = '\u2014';
      }
    } else {
      primaryLabel.textContent = 'Length';
      primaryEl.textContent = lenFmt.value;
      primarySubEl.textContent = lenFmt.label;
      perimEl.textContent = '\u2014';
      perimSubEl.textContent = '\u2014';
    }
  }

  function redraw() {
    clearLayers();
    const pts = state.points;
    if (pts.length === 0) { updateUI(); return; }

    const latlngs = pts.map(p => [p.lat, p.lng]);

    measureLayer = L.layerGroup().addTo(map);
    pts.forEach((p, i) => {
      if (state.showPoints) {
        const marker = L.circleMarker([p.lat, p.lng], {
          radius: 7, color: '#e94560', fillColor: '#ff6b81',
          fillOpacity: 1, weight: 2,
        }).addTo(measureLayer);
        marker.bindTooltip(`${i + 1}`, { permanent: true, direction: 'top', offset: [0, -10], className: 'point-label' });
      }

      const dragMarker = L.marker([p.lat, p.lng], {
        icon: L.divIcon({
          className: '', html: '<div style="width:18px;height:18px;background:transparent;cursor:grab"></div>',
          iconSize: [18, 18], iconAnchor: [9, 9],
        }),
        draggable: true, zIndexOffset: 5000,
      }).addTo(map);
      dragMarker._pointIndex = i;
      dragMarker.on('dragstart', () => { dragIndex = i; });
      dragMarker.on('drag', (e) => {
        const ll = e.target.getLatLng();
        state.points[i] = { lat: ll.lat, lng: ll.lng };
        redraw();
      });
      dragMarker.on('dragend', () => {
        state.redoStack = [];
        redoBtn.disabled = true;
        undoBtn.disabled = false;
        dragIndex = null;
      });
      dragMarkers.push(dragMarker);
    });

    const isAreaMode = state.mode === 'area';

    if (pts.length >= 2) {
      if (isAreaMode && pts.length >= 3) {
        drawnLayer = L.polygon(latlngs, {
          color: '#e94560', weight: 2, fillColor: '#e94560',
          fillOpacity: 0.15,
        }).addTo(map);
      } else {
        drawnLayer = L.polyline(latlngs, {
          color: '#0f3460', weight: 3, opacity: 0.8,
        }).addTo(map);
      }
    }

    updateUI();
  }

  function addPoint(latlng) {
    state.points.push(latlng);
    state.redoStack = [];
    redraw();
    undoBtn.disabled = false;
    redoBtn.disabled = true;
    drawBtn.textContent = state.points.length >= 3 ? 'Pause Drawing' : 'Pause Drawing';
  }

  function undoPoint() {
    if (state.points.length === 0) return;
    state.redoStack.push(state.points.pop());
    redraw();
    if (state.points.length === 0) undoBtn.disabled = true;
    redoBtn.disabled = false;
  }

  function redoPoint() {
    if (state.redoStack.length === 0) return;
    state.points.push(state.redoStack.pop());
    redraw();
    undoBtn.disabled = false;
    if (state.redoStack.length === 0) redoBtn.disabled = true;
  }

  function clearAll() {
    state.points = [];
    state.redoStack = [];
    clearLayers();
    if (ghostLine) { map.removeLayer(ghostLine); ghostLine = null; }
    if (ghostMarker) { map.removeLayer(ghostMarker); ghostMarker = null; }
    updateUI();
    undoBtn.disabled = true;
    redoBtn.disabled = true;
    clearBtn.disabled = true;
    drawBtn.textContent = 'Start Drawing';
    drawBtn.className = 'btn-primary';
  }

  function toggleMode() {
    if (state.mode === 'area') {
      state.mode = 'length';
      modeBtn.textContent = 'Length';
      modeBtn.classList.remove('active');
    } else {
      state.mode = 'area';
      modeBtn.textContent = 'Area';
      modeBtn.classList.add('active');
    }
    redraw();
  }

  function togglePoints() {
    state.showPoints = ptsCheckbox.checked;
    redraw();
  }

  function toggleLive() {
    if (!state.gpsActive) {
      moveToGps();
      // Live will start when GPS becomes active — set flag early
      state.live = true;
      liveBtn.textContent = 'Live ON';
      liveBtn.className = 'btn-live recording';
      return;
    }
    state.live = !state.live;
    if (state.live) {
      liveBtn.textContent = 'Live ON';
      liveBtn.className = 'btn-live recording';
      hintEl.textContent = 'Live tracking active — moving GPS path draws points automatically';
    } else {
      liveBtn.textContent = 'Live';
      liveBtn.className = 'btn-live';
      hintEl.textContent = state.points.length >= 3 ? 'Drag any point to adjust' : 'Live tracking stopped';
    }
  }

  // ---- GPS ----
  function updateGpsUI(pos) {
    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;
    const acc = pos.coords.accuracy;
    gpsPosition = { lat, lng };
    updateGpsUIFields(lat, lng, acc);
    updateGpsMarker(L.latLng(lat, lng), acc);
    gpsDropBtn.disabled = false;
    saveGpsBtn.disabled = false;
    liveBtn.disabled = false;
    if (state.live) {
      state.points.push({ lat, lng });
      state.redoStack = [];
      redraw();
      undoBtn.disabled = false;
      redoBtn.disabled = true;
    }
    if (map.getZoom() < 5) map.setView(L.latLng(lat, lng), 16);
  }

  function stopGps() {
    if (gpsWatchId !== null) {
      navigator.geolocation.clearWatch(gpsWatchId);
      gpsWatchId = null;
    }
    if (gpsMarker) { map.removeLayer(gpsMarker); gpsMarker = null; }
    if (gpsAccuracyCircle) { map.removeLayer(gpsAccuracyCircle); gpsAccuracyCircle = null; }
    gpsStatus.textContent = 'off';
    gpsDot.className = 'dot no-fix';
    gpsLatDisplay.textContent = 'Lat: \u2014';
    gpsLngDisplay.textContent = 'Lng: \u2014';
    gpsAccDisplay.textContent = 'Acc: \u2014';
    gpsPosition = null;
    state.gpsActive = false;
    gpsDropBtn.disabled = true;
    saveGpsBtn.disabled = true;
    liveBtn.disabled = true;
    if (state.live) toggleLive();
  }

  // ---- Move map to GPS location (auto-starts GPS if needed) ----
  function moveToGps() {
    if (!navigator.geolocation) {
      alert('GPS not available on this device');
      return;
    }

    gpsStatus.textContent = 'searching...';
    gpsDot.className = 'dot no-fix';

    if (!state.gpsActive) {
      // Request one-time position first — this triggers the Android permission prompt
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const { latitude, longitude, accuracy } = pos.coords;
          gpsPosition = { lat: latitude, lng: longitude };
          gpsDropBtn.disabled = false;
          saveGpsBtn.disabled = false;
          updateGpsUIFields(latitude, longitude, accuracy);
          updateGpsMarker(L.latLng(latitude, longitude), accuracy);
          map.setView([latitude, longitude], 16);
          // Start continuous tracking
          gpsWatchId = navigator.geolocation.watchPosition(
            (p) => updateGpsUI(p),
            (err) => { gpsStatus.textContent = `error (${err.code})`; gpsDot.className = 'dot no-fix'; },
            { enableHighAccuracy: true, maximumAge: 5000, timeout: 30000 }
          );
          state.gpsActive = true;
        },
        (err) => {
          gpsStatus.textContent = `error (${err.code})`;
          gpsDot.className = 'dot no-fix';
          if (err.code === 1) {
            alert('Location permission denied. Please enable GPS/location in your device settings and try again.');
          } else if (err.code === 2 || err.code === 3) {
            // POSITION_UNAVAILABLE or TIMEOUT — try again with longer timeout
            navigator.geolocation.getCurrentPosition(
              (pos) => {
                const { latitude, longitude, accuracy } = pos.coords;
                gpsPosition = { lat: latitude, lng: longitude };
                gpsDropBtn.disabled = false;
                saveGpsBtn.disabled = false;
                updateGpsUIFields(latitude, longitude, accuracy);
                updateGpsMarker(L.latLng(latitude, longitude), accuracy);
                map.setView([latitude, longitude], 16);
                gpsWatchId = navigator.geolocation.watchPosition(
                  (p) => updateGpsUI(p),
                  (e) => { gpsStatus.textContent = `error (${e.code})`; gpsDot.className = 'dot no-fix'; },
                  { enableHighAccuracy: true, maximumAge: 5000, timeout: 30000 }
                );
                state.gpsActive = true;
              },
              (e2) => {
                gpsStatus.textContent = `error (${e2.code})`;
                gpsDot.className = 'dot no-fix';
                alert('Unable to get GPS position. Make sure location is enabled in device settings.');
              },
              { enableHighAccuracy: true, timeout: 60000, maximumAge: 0 }
            );
          }
        },
        { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 }
      );
    } else if (gpsPosition) {
      map.setView([gpsPosition.lat, gpsPosition.lng], Math.max(map.getZoom(), 16));
    }
  }

  function updateGpsUIFields(lat, lng, acc) {
    gpsStatus.textContent = 'active';
    gpsDot.className = 'dot fix';
    gpsLatDisplay.textContent = `Lat: ${lat.toFixed(6)}`;
    gpsLngDisplay.textContent = `Lng: ${lng.toFixed(6)}`;
    gpsAccDisplay.textContent = `Acc: ${(acc || 0).toFixed(1)}m`;
  }

  function updateGpsMarker(latlng, acc) {
    if (gpsMarker) { gpsMarker.setLatLng(latlng); }
    else {
      gpsMarker = L.marker(latlng, {
        icon: L.divIcon({ className: '', html: '<div class="gps-marker-pulse"></div>', iconSize: [12, 12], iconAnchor: [6, 6] }),
        zIndexOffset: 10000,
      }).addTo(map);
    }
    if (gpsAccuracyCircle) { gpsAccuracyCircle.setLatLng(latlng); gpsAccuracyCircle.setRadius(acc || 0); }
    else {
      gpsAccuracyCircle = L.circle(latlng, { radius: acc || 0, color: '#4cc9f0', fillColor: '#4cc9f0', fillOpacity: 0.08, weight: 1 }).addTo(map);
    }
  }

  // ---- 2a: Save GPS location (pin) ----
  async function saveCurrentGps() {
    if (!gpsPosition) return;
    const name = prompt('Name this GPS location:', `Point ${Store.pins.length + 1}`);
    if (!name) return;
    await Store.addPin({ name, lat: gpsPosition.lat, lng: gpsPosition.lng });
    hintEl.textContent = `Saved: ${name}`;
    setTimeout(() => { hintEl.textContent = defaultHint(); }, 3000);
  }

  function defaultHint() {
    if (state.live) return 'Live tracking active \u2014 moving GPS path draws points automatically';
    return state.points.length >= 3 ? 'Drag any point to adjust' : 'Click on the map to place points and form a polygon';
  }

  // ---- Saved locations modal ----

  // ---- Search with suggestions; typing shows matches, clicking / Enter moves the map ----
  let searchTimeout = null;
  let searchData = [];
  let selectedIdx = -1;

  function doSearch(query) {
    return fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=8&addressdetails=1`)
      .then(r => r.json());
  }

  function isCoordInput(val) {
    const trimmed = val.trim();
    const coordRegex = /^-?\d+\.?\d*\s*[, ]+\s*-?\d+\.?\d*$/;
    return coordRegex.test(trimmed);
  }

  function parseCoord(val) {
    const parts = val.trim().split(/[, ]+/).filter(Boolean);
    if (parts.length >= 2) {
      const lat = parseFloat(parts[0]);
      const lng = parseFloat(parts[1]);
      if (!isNaN(lat) && !isNaN(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
        return { lat, lng };
      }
    }
    return null;
  }

  function flyToData(item) {
    const lat = parseFloat(item.lat);
    const lng = parseFloat(item.lon);
    if (isNaN(lat) || isNaN(lng)) return;
    map.setView([lat, lng], 16);
    hintEl.textContent = item.display_name;
    searchInput.value = item.display_name;
    hideSuggestions();
  }

  function hideSuggestions() {
    searchResults.style.display = 'none';
    selectedIdx = -1;
  }

  function showSuggestions(data) {
    searchData = data;
    selectedIdx = -1;
    searchResults.innerHTML = '';
    if (data.length === 0) {
      hideSuggestions();
      return;
    }
    data.forEach((item, i) => {
      const div = document.createElement('div');
      div.textContent = item.display_name;
      div.addEventListener('mousedown', (e) => e.preventDefault());
      div.addEventListener('click', () => flyToData(item));
      searchResults.appendChild(div);
    });
    searchResults.style.display = 'block';
  }

  function goToSelected() {
    const val = searchInput.value.trim();
    if (!val) return;

    if (searchResults.style.display === 'block') {
      if (selectedIdx >= 0 && selectedIdx < searchData.length) {
        flyToData(searchData[selectedIdx]);
      } else if (searchData.length > 0) {
        flyToData(searchData[0]);
      }
      hideSuggestions();
      if (val) searchInput.blur();
      return;
    }

    if (isCoordInput(val)) {
      const coord = parseCoord(val);
      if (coord) {
        map.setView([coord.lat, coord.lng], 16);
        hintEl.textContent = `Lat: ${coord.lat.toFixed(6)}, Lng: ${coord.lng.toFixed(6)}`;
        return;
      }
    }

    const match = searchData.find(d => d.display_name === val);
    if (match) {
      flyToData(match);
      return;
    }

    hintEl.textContent = 'Searching\u2026';
    doSearch(val).then(data => {
      if (data.length === 0) {
        hintEl.textContent = 'Place not found';
        return;
      }
      flyToData(data[0]);
    }).catch(() => { hintEl.textContent = 'Search failed \u2014 check connection'; });
  }

  searchInput.addEventListener('input', () => {
    const val = searchInput.value.trim();
    if (val.length < 2 || isCoordInput(val)) {
      hideSuggestions();
      searchData = [];
      return;
    }
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
      doSearch(val).then(data => showSuggestions(data)).catch(() => {});
    }, 400);
  });

  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      goToSelected();
    } else if (e.key === 'ArrowDown' && searchResults.style.display === 'block') {
      e.preventDefault();
      selectedIdx = Math.min(selectedIdx + 1, searchData.length - 1);
      [...searchResults.children].forEach((c, i) => c.classList.toggle('selected', i === selectedIdx));
    } else if (e.key === 'ArrowUp' && searchResults.style.display === 'block') {
      e.preventDefault();
      selectedIdx = Math.max(selectedIdx - 1, 0);
      [...searchResults.children].forEach((c, i) => c.classList.toggle('selected', i === selectedIdx));
    }
  });

  searchGoBtn.addEventListener('click', goToSelected);

  // Close suggestions on click outside
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrap')) {
      hideSuggestions();
    }
  });

  // ---- 2b: Screenshot (works on Android via Filesystem + Share) ----
  async function takeScreenshot() {
    if (typeof html2canvas === 'undefined') {
      alert('Screenshot library not loaded.');
      return;
    }
    const zoomCtrl = document.querySelector('.leaflet-control-zoom');
    const oldHint = hintEl.textContent;
    if (zoomCtrl) zoomCtrl.style.display = 'none';
    hideSuggestions();
    hintEl.textContent = 'Capturing\u2026';

    try {
      const canvas = await html2canvas(document.body, {
        useCORS: true, allowTaint: false, scale: 2, backgroundColor: '#0d1b2a',
        logging: false,
      });
      const dataUrl = canvas.toDataURL('image/png');
      const base64 = dataUrl.split(',')[1];
      const filename = `map-${Date.now()}.png`;

      if (Store.isNative) {
        const FS = (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem) ||
                   (window.capacitorFilesystem && window.capacitorFilesystem.Filesystem);
        const path = `maparea/screenshots/${filename}`;
        await FS.writeFile({ path, directory: 'DOCUMENTS', data: base64 });
        const savedPath = await FS.getUri({ path, directory: 'DOCUMENTS' });
        const share = (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Share) ||
                      (window.capacitorShare && window.capacitorShare.Share);
        await share.share({
          title: 'Map Screenshot',
          files: [savedPath.uri],
          dialogTitle: 'Save or share screenshot',
        });
        hintEl.textContent = 'Screenshot saved';
      } else {
        const link = document.createElement('a');
        link.download = filename;
        link.href = dataUrl;
        link.click();
        hintEl.textContent = 'Screenshot saved to Downloads';
      }
    } catch (err) {
      console.error('Screenshot error', err);
      if (zoomCtrl) zoomCtrl.style.display = '';
      hintEl.textContent = oldHint;
      alert('Screenshot failed' + (err && err.message ? `: ${err.message}` : ''));
      return;
    }
    if (zoomCtrl) zoomCtrl.style.display = '';
    setTimeout(() => { hintEl.textContent = defaultHint(); }, 3000);
  }

  // ---- 2c: Save/Load map markings (JSON file on Android) ----
  async function saveMap() {
    if (state.points.length === 0) return;
    const name = prompt('Name this map:', `Map ${Date.now()}`);
    if (!name) return;
    const data = { name, points: state.points, areaUnit: unitSelect.value, lenUnit: lenUnitSelect.value, mode: state.mode };
    await Store.setMap(name, data);
    hintEl.textContent = `Saved map: ${name}`;
    setTimeout(() => { hintEl.textContent = defaultHint(); }, 3000);
  }

  function loadMap() {
    const names = Object.keys(Store.maps);
    if (names.length === 0) { alert('No saved maps'); return; }

    const div = document.createElement('div');
    div.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:10000;background:rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;justify-content:center';
    const box = document.createElement('div');
    box.style.cssText = 'background:#1a1a2e;color:#eee;padding:20px;border-radius:8px;max-width:90vw;max-height:80vh;overflow-y:auto';
    box.innerHTML = '<h3 style="margin-bottom:10px">Open Map</h3>';
    names.forEach(name => {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid #333';
      const data = Store.maps[name];
      const label = document.createElement('span');
      label.textContent = data && data.mode === 'length' ? `${name} (length)` : name;
      label.style.cssText = 'flex:1;font-size:13px';
      const openBtn = document.createElement('button');
      openBtn.textContent = 'Open';
      openBtn.className = 'btn-primary';
      openBtn.style.cssText = 'padding:3px 8px;border:none;border-radius:4px;cursor:pointer;font-size:11px';
      const delBtn = document.createElement('button');
      delBtn.textContent = 'Delete';
      delBtn.className = 'btn-danger';
      delBtn.style.cssText = 'padding:3px 8px;border:none;border-radius:4px;cursor:pointer;font-size:11px';
      row.appendChild(label);
      row.appendChild(openBtn);
      row.appendChild(delBtn);
      box.appendChild(row);

      openBtn.addEventListener('click', () => {
        const data = Store.maps[name];
        state.points = data.points.map(p => ({ lat: p.lat, lng: p.lng }));
        state.redoStack = [];
        if (data.areaUnit) unitSelect.value = data.areaUnit;
        if (data.lenUnit) lenUnitSelect.value = data.lenUnit;
        if (data.mode) {
          state.mode = data.mode;
          modeBtn.textContent = state.mode === 'area' ? 'Area' : 'Length';
          modeBtn.classList.toggle('active', state.mode === 'area');
        }
        state.drawing = false;
        if (ghostLine) { map.removeLayer(ghostLine); ghostLine = null; }
        if (ghostMarker) { map.removeLayer(ghostMarker); ghostMarker = null; }
        map.off('click', onMapClick);
        map.off('mousemove', onMapMove);
        redraw();
        if (state.points.length > 0) {
          setTimeout(() => {
            map.fitBounds(state.points.map(p => [p.lat, p.lng]), { padding: [40, 40], maxZoom: 18 });
          }, 100);
        }
        undoBtn.disabled = false;
        drawBtn.textContent = state.points.length > 0 ? 'Continue Drawing' : 'Start Drawing';
        drawBtn.className = 'btn-primary';
        div.remove();
      });
      delBtn.addEventListener('click', async () => {
        await Store.deleteMap(name);
        row.remove();
        if (Object.keys(Store.maps).length === 0) div.remove();
      });
    });
    const closeBtn = document.createElement('button');
    closeBtn.textContent = 'Close';
    closeBtn.className = 'btn-secondary';
    closeBtn.style.cssText = 'margin-top:10px;padding:5px 12px;border:none;border-radius:4px;cursor:pointer;font-size:12px';
    closeBtn.addEventListener('click', () => div.remove());
    box.appendChild(closeBtn);
    div.appendChild(box);
    document.body.appendChild(div);
  }

  // ---- Drawing mode ----
  function onMapClick(e) {
    addPoint(e.latlng);
  }

  function onMapMove(e) {
    if (state.points.length === 0) return;
    const pts = state.points;
    const latlng = e.latlng;

    if (ghostMarker) map.removeLayer(ghostMarker);
    ghostMarker = L.circleMarker([latlng.lat, latlng.lng], {
      radius: 4, color: '#e94560', fillColor: '#ff6b81',
      fillOpacity: 0.5, weight: 1, dashArray: '3,3',
    }).addTo(map);

    if (ghostLine) map.removeLayer(ghostLine);
    const allPoints = [...pts.map(p => [p.lat, p.lng]), [latlng.lat, latlng.lng]];
    ghostLine = L.polyline(allPoints, {
      color: '#e94560', weight: 2, opacity: 0.4, dashArray: '5,5',
    }).addTo(map);
  }

  function enableDrawing() {
    state.drawing = true;
    map.on('click', onMapClick);
    map.on('mousemove', onMapMove);
    map.getContainer().style.cursor = 'crosshair';
    drawBtn.textContent = 'Pause Drawing';
    drawBtn.className = 'btn-warning';
    hintEl.textContent = 'Click map or tap here from GPS walk to place points';
  }

  function disableDrawing() {
    state.drawing = false;
    map.off('click', onMapClick);
    map.off('mousemove', onMapMove);
    map.getContainer().style.cursor = '';
    if (ghostLine) { map.removeLayer(ghostLine); ghostLine = null; }
    if (ghostMarker) { map.removeLayer(ghostMarker); ghostMarker = null; }
    drawBtn.textContent = 'Continue Drawing';
    drawBtn.className = 'btn-primary';
    hintEl.textContent = state.points.length >= 3 ? 'Drag any point to adjust' : 'Click Start Drawing to begin';
  }

  function startNewDrawing() {
    clearAll();
    enableDrawing();
  }

  function ensureDrawing() {
    if (state.points.length >= 3) {
      startNewDrawing();
    } else {
      enableDrawing();
    }
  }

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && state.drawing && gpsPosition) {
      e.preventDefault();
      addPoint(L.latLng(gpsPosition.lat, gpsPosition.lng));
    }
  });

  drawBtn.addEventListener('click', () => {
    if (state.drawing) {
      disableDrawing();
    } else if (state.points.length > 0) {
      enableDrawing();
    } else {
      enableDrawing();
    }
  });

  gpsLocateBtn.addEventListener('click', moveToGps);
  saveGpsBtn.addEventListener('click', saveCurrentGps);

  gpsDropBtn.addEventListener('click', () => {
    if (gpsPosition && state.drawing) {
      addPoint(L.latLng(gpsPosition.lat, gpsPosition.lng));
    }
  });

  liveBtn.addEventListener('click', toggleLive);
  undoBtn.addEventListener('click', undoPoint);
  redoBtn.addEventListener('click', redoPoint);
  clearBtn.addEventListener('click', clearAll);
  modeBtn.addEventListener('click', toggleMode);
  ptsCheckbox.addEventListener('change', togglePoints);
  unitSelect.addEventListener('change', updateUI);
  lenUnitSelect.addEventListener('change', updateUI);

  saveMapBtn.addEventListener('click', saveMap);
  loadMapBtn.addEventListener('click', loadMap);
  screenshotBtn.addEventListener('click', takeScreenshot);
  pinsBtn.addEventListener('click', showSavedLocations);

  Store.init();

  enableDrawing();
})();
</script>
</body>
</html>
